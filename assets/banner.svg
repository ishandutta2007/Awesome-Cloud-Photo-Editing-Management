<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.1); }
      100% { opacity: 0.35; transform: scale(1); }
    }
    @keyframes orbitLine {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    .floating-card {
      animation: floatSlow 7s ease-in-out infinite;
    }
    .floating-card-reverse {
      animation: floatSlow 8.5s ease-in-out infinite reverse;
    }
    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 7.5s ease-in-out infinite 1s;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 12 18;
      animation: orbitLine 20s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulsing-orb-1" cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glowCyan)" />
  <circle class="pulsing-orb-2" cx="1020" cy="310" r="160" fill="#818cf8" opacity="0.25" filter="url(#glowPurple)" />
  <circle cx="600" cy="390" r="180" fill="#c084fc" opacity="0.15" filter="url(#glowPurple)" />

  <!-- Decorative Orbit / Flow Lines -->
  <path class="stream-line" d="M -50,140 Q 300,40 600,160 T 1250,110" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" />
  <path class="stream-line" d="M -50,310 Q 350,380 700,240 T 1250,290" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.35" />

  <!-- Background Decorative Visual Elements (Cards/Diagram Pills placed at margins) -->
  <g class="floating-card" opacity="0.85">
    <rect x="50" y="240" width="180" height="60" rx="12" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="75" cy="270" r="12" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 70 270 L 80 270 M 75 265 L 75 275" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="100" y="267" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">RAW Pipeline</text>
    <text x="100" y="285" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Non-Destructive</text>
  </g>

  <g class="floating-card-reverse" opacity="0.85">
    <rect x="970" y="70" width="180" height="60" rx="12" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="995" cy="100" r="12" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 990 100 L 994 104 L 1001 96" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1020" y="97" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">Self-Hosted</text>
    <text x="1020" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Zero Lock-In</text>
  </g>

  <!-- Foreground Main Title & Content (Fully Legible & Unobscured) -->
  <g text-anchor="middle" id="foreground-content">
    <!-- Category Badge -->
    <rect x="475" y="55" width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-1">
      Awesome Cloud Photo
    </text>
    <text x="600" y="198" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      Editing &amp; Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="17">
      The definitive index of Cloud SaaS suites, Self-Hosted photo servers, &amp; Open-Source RAW powerhouses
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(245, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">📸 RAW Editing</text>
      
      <!-- Tag 2 -->
      <rect x="145" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="212" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">☁️ Cloud SaaS</text>

      <!-- Tag 3 -->
      <rect x="295" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="367" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">🏠 Self-Hosted</text>

      <!-- Tag 4 -->
      <rect x="455" y="0" width="125" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="517" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">⭐ Open-Source</text>

      <!-- Tag 5 -->
      <rect x="595" y="0" width="115" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="652" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13">⚡ AI Masking</text>
    </g>
  </g>
</svg>
